    Projects:
      - name: Sudoku Classification Project - CNN vs Generative Models
        summary: >
          Classified Sudoku and non-Sudoku images using Auto-Encoders, Variational Auto-Encoders,
          and Convolutional Neural Networks on data based on MNIST digits.
        highlights:
          - Compared AE, VAE, and CNN architectures.
          - Evaluated performance on 3x3 Sudoku and non-Sudoku image data.

      - name: Movies Recommendation System Using BERT
        summary: >
          Built a transformer-based movie and series recommendation system using BERT embeddings,
          FastAPI, and Streamlit.
        highlights:
          - Processed data, generated embeddings, exposed an API, and built a user-facing interface.

      - name: Stamp Recognition Project
        summary: >
          Developed a stamp detection, classification, and comparison solution using machine learning
          and computer vision techniques.
        highlights:
